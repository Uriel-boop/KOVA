<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KOVA - Prestador de Servicios</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; }
        .header { display: flex; justify-content: space-between; padding: 20px; background: white; border-bottom: 1px solid #ddd; }
        .btn-rosa { background: #d76ba6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .contenedor-principal { display: flex; gap: 20px; padding: 20px; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 50%; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: gray; padding: 30px; border-radius: 10px; width: 80%; max-width: 600px; color: white; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; margin-top: 5px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        #div_ubicacion { display: none; } /* Oculto por defecto */
        .servicio-item { padding: 10px; border-bottom: 1px solid #ddd; cursor: pointer; }
        .info-valor { color: black; margin-bottom: 15px; }
        .info-label { color: #d76ba6; margin-bottom: 2px; font-weight: bold; }
        .img-preview { width: 100px; height: 100px; object-fit: cover; border: 2px solid white; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="img/LOGO_KOVA.png" width="40" alt="KOVA">
            <span style="border: 2px solid #d76ba6; color: #d76ba6; padding: 5px 15px; border-radius: 20px;">Prestador de Servicios</span>
        </div>
        <button class="btn-rosa" style="background:white; color:#d76ba6; border: 1px solid #d76ba6;" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <h2 style="padding-left: 20px;">Hola, "<span id="nombre-usuario"></span>", Bienvenido</h2>

    <div class="contenedor-principal">
        <!-- Lista de Servicios Agregados -->
        <div class="panel">
            <h3>Servicios Agregados</h3>
            <div id="lista-servicios">
                <p>No hay ningún servicio registrado aún</p>
            </div>
            <button class="btn-rosa" style="margin-top: 20px;" onclick="document.getElementById('modalServicio').style.display='flex'">Registrar servicio</button>
        </div>

        <!-- Detalles del Servicio -->
        <div class="panel" id="detalle-servicio">
            <h3>Mis Servicios</h3>
            <p>No hay ningún servicio en la lista</p>
        </div>
    </div>

    <!-- Modal Formulario -->
    <div id="modalServicio" class="modal">
        <div class="modal-content">
            <h2>Agregar Servicio</h2>
            <form id="form-servicio">
                <div class="form-group">
                    <label>¿Qué tipo de servicio va a prestar?</label>
                    <input type="text" id="tipo_servicio" placeholder="Ej: Veterinaria, estética..." required>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Nombre del prestador</label>
                        <input type="text" id="nombre_prestador" required>
                    </div>
                    <div class="form-group">
                        <label>Edad (Años)</label>
                        <input type="number" id="edad" min="18" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Descripción de tu servicio</label>
                    <textarea id="descripcion" required></textarea>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Imágenes del servicio (2 máx)</label>
                        <input type="file" id="imagen1" accept="image/*" required>
                        <input type="file" id="imagen2" accept="image/*">
                    </div>
                    <div>
                        <div class="form-group">
                            <label>Días de servicio (Ej: Lun-Vie)</label>
                            <input type="text" id="dias_servicio" required>
                        </div>
                        <div class="form-group">
                            <label>Precio de cobro (MXN)</label>
                            <input type="number" id="precio" required>
                        </div>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Lugar del servicio</label>
                        <select id="lugar_servicio" required>
                            <option value="">Seleccione...</option>
                            <option value="A domicilio">A domicilio</option>
                            <option value="Sucursal física">Sucursal física</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>
                    <div class="form-group" id="div_ubicacion">
                        <label>Agregar ubicación</label>
                        <input type="text" id="ubicacion" placeholder="Dirección completa">
                    </div>
                </div>
                <div class="form-group">
                    <label>Contacto (Tel o Correo)</label>
                    <input type="text" id="contacto" required>
                </div>
                <div style="display:flex; justify-content: space-between; margin-top:20px;">
                    <button type="submit" class="btn-rosa" style="background:white; color:black;">Guardar en la base de datos</button>
                    <button type="button" class="btn-rosa" style="background:white; color:black;" onclick="document.getElementById('modalServicio').style.display='none'">CANCELAR</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';
        let currentUser = JSON.parse(localStorage.getItem('kova_current_user'));
        if (!currentUser) window.location.href = 'index.html';
        document.getElementById('nombre-usuario').innerText = currentUser.nombre_completo || 'Usuario';

        // Lógica condicional para mostrar la ubicación
        document.getElementById('lugar_servicio').addEventListener('change', function() {
            const divUbicacion = document.getElementById('div_ubicacion');
            if (this.value === 'Sucursal física') {
                divUbicacion.style.display = 'block';
                document.getElementById('ubicacion').setAttribute('required', 'true');
            } else {
                divUbicacion.style.display = 'none';
                document.getElementById('ubicacion').removeAttribute('required');
                document.getElementById('ubicacion').value = '';
            }
        });

        // Cargar servicios al abrir la página (Actualizado con id_usuario)
        async function cargarServicios() {
            try {
                // Se cambió currentUser.id por currentUser.id_usuario
                const res = await fetch(`${API_URL}/api/mis_servicios/${currentUser.id_usuario}`);
                const servicios = await res.json();
                const lista = document.getElementById('lista-servicios');
                
                if (servicios.length === 0) {
                    lista.innerHTML = '<p>No hay ningún servicio registrado aún</p>';
                    return;
                }

                lista.innerHTML = '';
                servicios.forEach((serv, index) => {
                    const item = document.createElement('div');
                    item.className = 'servicio-item';
                    item.innerHTML = `<strong>${index + 1} - ${serv.tipo_servicio}</strong>`;
                    item.onclick = () => mostrarDetalle(serv, index + 1);
                    lista.appendChild(item);
                });
            } catch (e) { console.error('Error cargando servicios:', e); }
        }

        // Mostrar detalle del servicio y el mapa de Google
        function mostrarDetalle(serv, numero) {
            const detalle = document.getElementById('detalle-servicio');
            
            // Lógica para enlace a Google Maps si es sucursal
            let ubicacionHtml = '';
            if (serv.lugar_servicio === 'Sucursal física' && serv.ubicacion) {
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(serv.ubicacion)}`;
                ubicacionHtml = `
                    <div class="info-label">Ubicación</div>
                    <div class="info-valor"><a href="${mapsUrl}" target="_blank" style="color:blue;">${serv.ubicacion} (Ver en Google Maps)</a></div>
                `;
            }

            detalle.innerHTML = `
                <div style="display:flex; justify-content: space-between;">
                    <h2>Servicios</h2>
                    <div><a href="#" style="color:red; text-decoration:none;">Eliminar</a><br><a href="#" style="color:teal; text-decoration:none;">Editar</a></div>
                </div>
                <div class="grid-2">
                    <div>
                        <div class="info-label">Tipo del servicio</div>
                        <div class="info-valor">${numero} - ${serv.tipo_servicio}</div>
                        
                        <div class="info-label">Nombre del prestador</div>
                        <div class="info-valor">${serv.nombre_prestador}</div>
                        
                        <div class="info-label">Imágenes del producto</div>
                        <div class="info-valor">
                            ${serv.imagen1 ? `<img src="${API_URL}/static/uploads/${serv.imagen1}" class="img-preview">` : ''}
                            ${serv.imagen2 ? `<img src="${API_URL}/static/uploads/${serv.imagen2}" class="img-preview">` : ''}
                        </div>

                        <div class="info-label">Lugar del servicio</div>
                        <div class="info-valor">${serv.lugar_servicio}</div>
                        ${ubicacionHtml}
                    </div>
                    <div>
                        <div class="info-label">Edad</div>
                        <div class="info-valor">${serv.edad} (años)</div>
                        
                        <div class="info-label">Descripción</div>
                        <div class="info-valor">${serv.descripcion}</div>
                        
                        <div class="info-label">Días de servicio</div>
                        <div class="info-valor">${serv.dias_servicio}</div>
                        
                        <div class="info-label">Precio del servicio</div>
                        <div class="info-valor">${serv.precio} mxn</div>
                        
                        <div class="info-label">Contacto del prestador</div>
                        <div class="info-valor">${serv.contacto}</div>
                    </div>
                </div>
            `;
        }

        // Guardar nuevo servicio (Actualizado con id_usuario)
        document.getElementById('form-servicio').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            
            // Se cambió currentUser.id por currentUser.id_usuario
            formData.append('id_usuario', currentUser.id_usuario);
            
            formData.append('tipo_servicio', document.getElementById('tipo_servicio').value);
            formData.append('nombre_prestador', document.getElementById('nombre_prestador').value);
            formData.append('edad', document.getElementById('edad').value);
            formData.append('descripcion', document.getElementById('descripcion').value);
            formData.append('dias_servicio', document.getElementById('dias_servicio').value);
            formData.append('precio', document.getElementById('precio').value);
            formData.append('lugar_servicio', document.getElementById('lugar_servicio').value);
            formData.append('ubicacion', document.getElementById('ubicacion').value);
            formData.append('contacto', document.getElementById('contacto').value);
            
            const file1 = document.getElementById('imagen1').files[0];
            const file2 = document.getElementById('imagen2').files[0];
            if(file1) formData.append('imagen1', file1);
            if(file2) formData.append('imagen2', file2);

            try {
                const res = await fetch(`${API_URL}/api/crear_servicio`, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    alert('Servicio guardado correctamente');
                    document.getElementById('modalServicio').style.display = 'none';
                    document.getElementById('form-servicio').reset();
                    cargarServicios();
                } else alert('Error: ' + data.message);
            } catch (error) { console.error('Error:', error); }
        });
        function cerrarSesion() {
            localStorage.removeItem('kova_current_user');
            window.location.href = 'index.html';
        }

        cargarServicios();
    </script>
</body>
</html>
